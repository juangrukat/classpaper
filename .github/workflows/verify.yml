name: Build and verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: classpaper
          POSTGRES_USER: classpaper
          POSTGRES_PASSWORD: disposable-ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U classpaper"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          CHROMIUM_NO_SANDBOX: 'true'
      - run: docker build -t classpaper:ci .
      - run: >-
          docker run -d --name classpaper-ci --network host --cap-drop ALL
          --security-opt no-new-privileges --memory 1g --pids-limit 256
          -e PORT=3310 -e ALLOW_REGISTRATION=true
          -e PUBLIC_URL=http://localhost:3310
          -e DATABASE_URL=postgres://classpaper:disposable-ci-password@127.0.0.1:5432/classpaper
          classpaper:ci
      - run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:3310/health/ready && break || sleep 2; done
          mkdir -p ../docs/production/evidence
          node --import tsx scripts/verify-deployment.ts
      - if: always()
        run: docker logs classpaper-ci
