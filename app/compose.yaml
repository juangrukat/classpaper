services:
  app:
    build: .
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb
    mem_limit: 1g
    pids_limit: 256
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      DATABASE_URL: postgres://classpaper:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/classpaper
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3100}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/data
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: classpaper
      POSTGRES_USER: classpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpaper -d classpaper"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres:
  media:
